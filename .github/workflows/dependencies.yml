name: Dependencies

# Runs on every pull request, so that trunk can require it. The Dependabot
# auto-merge workflow needs a required check that every Dependabot PR gets.
on:
  push:
    branches:
      - trunk
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare node
        uses: ./packages/github-actions/actions/prepare-node
        with:
          node-version-file: .nvmrc
          cache-dependency-path: |
            ./package-lock.json
            ./packages/github-actions/package-lock.json
            ./packages/js/jsdoc/package-lock.json

      - name: Install npm dependencies of the packages
        run: |
          npm ci --ignore-scripts --prefix packages/github-actions
          npm ci --ignore-scripts --prefix packages/js/jsdoc

      - name: Build and test the github-actions package
        working-directory: packages/github-actions
        run: |
          npm run build
          npm test

      - name: Prepare PHP
        uses: ./packages/github-actions/actions/prepare-php
        with:
          php-version: 7.4
          install-deps: "no"

      - name: Install Composer dependencies
        run: |
          # Skip installing packages from private repos.
          composer remove --dev woocommerce/woorelease
          composer install --prefer-dist --no-interaction
          composer install --prefer-dist --no-interaction --working-dir=packages/github-actions/actions/hook-documentation
          composer install --prefer-dist --no-interaction --working-dir=plugins/grow-smooth-generator

      - name: Test the hook-documentation action
        run: composer test --working-dir=packages/github-actions/actions/hook-documentation
