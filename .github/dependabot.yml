version: 2
# Security updates only: a limit of 0 turns off version-update PRs. The
# Dependabot auto-merge rollout asks for every lockfile to be listed here.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/github-actions"
      - "/packages/js/jsdoc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "composer"
    directories:
      - "/"
      - "/packages/github-actions/actions/hook-documentation"
      - "/plugins/grow-smooth-generator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
