packages:
  - packages/github-actions
  - packages/js/*

overrides:
  '@wordpress/eslint-plugin@<23.0.0': ^23.0.0
  prettier: npm:wp-prettier@3.0.3
  'minimatch@>=9.0.0 <9.0.9': 9.0.9

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@wordpress/*'
  - '@woocommerce/*'
  - '@automattic/*'

allowBuilds:
  core-js: false
  unrs-resolver: false
