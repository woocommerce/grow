packages:
  - packages/github-actions
  - packages/js/*

overrides:
  '@wordpress/eslint-plugin@<23.0.0': ^23.0.0
  prettier: npm:wp-prettier@3.0.3
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@wordpress/*'
  - '@woocommerce/*'
  - '@automattic/*'

allowBuilds:
  core-js: false
  unrs-resolver: false
